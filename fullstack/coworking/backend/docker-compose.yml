services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coworking
    ports:
      - '5432:5432'
    volumes:
      - coworking_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/coworking?schema=public
      PORT: 3333
      JWT_SECRET: ${JWT_SECRET:-troque-por-um-segredo-forte}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      NODE_ENV: production
    ports:
      - '3333:3333'

volumes:
  coworking_db_data:
