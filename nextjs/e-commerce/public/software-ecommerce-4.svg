  <!-- Code -->
  <text x="460" y="195" font-family="Courier New, monospace" font-size="14" fill="#c678dd">import</text>
  <text x="530" y="195" font-family="Courier New, monospace" font-size="14" fill="#e5e5e5">React</text>
  <text x="605" y="195" font-family="Courier New, monospace" font-size="14" fill="#c678dd">from</text>
  <text x="665" y="195" font-family="Courier New, monospace" font-size="14" fill="#98c379">'react'</text>
  
  <text x="460" y="220" font-family="Courier New, monospace" font-size="14" fill="#c678dd">import</text>
  <text x="530" y="220" font-family="Courier New, monospace" font-size="14" fill="#e5c07b">Header</text>
  <text x="615" y="220" font-family="Courier New, monospace" font-size="14" fill="#c678dd">from</text>
  <text x="675" y="220" font-family="Courier New, monospace" font-size="14" fill="#98c379">'./Header'</text>
  
  <text x="460" y="270" font-family="Courier New, monospace" font-size="14" fill="#c678dd">function</text>
  <text x="555" y="270" font-family="Courier New, monospace" font-size="14" fill="#61afef">App</text>
  <text x="600" y="270" font-family="Courier New, monospace" font-size="14" fill="#abb2bf">()</text>
  <text x="635" y="270" font-family="Courier New, monospace" font-size="14" fill="#abb2bf">{</text>
  
