  <text x="560" y="295" font-family="Courier New, monospace" font-size="14" fill="#e06c75">[</text>
  <text x="575" y="295" font-family="Courier New, monospace" font-size="14" fill="#e5e5e5">count</text>
  <text x="640" y="295" font-family="Courier New, monospace" font-size="14" fill="#abb2bf">,</text>
  <text x="660" y="295" font-family="Courier New, monospace" font-size="14" fill="#e5e5e5">setCount</text>
  <text x="755" y="295" font-family="Courier New, monospace" font-size="14" fill="#e06c75">]</text>
  <text x="775" y="295" font-family="Courier New, monospace" font-size="14" fill="#56b6c2">=</text>
  <text x="800" y="295" font-family="Courier New, monospace" font-size="14" fill="#61afef">useState</text>
  <text x="900" y="295" font-family="Courier New, monospace" font-size="14" fill="#abb2bf">(</text>
  <text x="915" y="295" font-family="Courier New, monospace" font-size="14" fill="#d19a66">0</text>
  <text x="930" y="295" font-family="Courier New, monospace" font-size="14" fill="#abb2bf">)</text>
  
  <text x="490" y="345" font-family="Courier New, monospace" font-size="14" fill="#c678dd">return</text>
  <text x="565" y="345" font-family="Courier New, monospace" font-size="14" fill="#abb2bf">(</text>
  
  <text x="520" y="370" font-family="Courier New, monospace" font-size="14" fill="#e06c75">&lt;</text>
  <text x="535" y="370" font-family="Courier New, monospace" font-size="14" fill="#e06c75">div</text>
  <text x="580" y="370" font-family="Courier New, monospace" font-size="14" fill="#d19a66">className</text>
  <text x="690" y="370" font-family="Courier New, monospace" font-size="14" fill="#56b6c2">=</text>
  <text x="705" y="370" font-family="Courier New, monospace" font-size="14" fill="#98c379">"container"</text>
  <text x="825" y="370" font-family="Courier New, monospace" font-size="14" fill="#e06c75">&gt;</text>
  
  <text x="550" y="395" font-family="Courier New, monospace" font-size="14" fill="#e06c75">&lt;</text>
  <text x="565" y="395" font-family="Courier New, monospace" font-size="14" fill="#e06c75">Header</text>
  <text x="645" y="395" font-family="Courier New, monospace" font-size="14" fill="#e06c75">/&gt;</text>
  
  <text x="550" y="420" font-family="Courier New, monospace" font-size="14" fill="#e06c75">&lt;</text>
  <text x="565" y="420" font-family="Courier New, monospace" font-size="14" fill="#e06c75">h1</text>
  <text x="600" y="420" font-family="Courier New, monospace" font-size="14" fill="#e06c75">&gt;</text>
  <text x="615" y="420" font-family="Courier New, monospace" font-size="14" fill="#abb2bf">Count:</text>
  <text x="690" y="420" font-family="Courier New, monospace" font-size="14" fill="#abb2bf">{</text>
  <text x="705" y="420" font-family="Courier New, monospace" font-size="14" fill="#e5e5e5">count</text>
  <text x="760" y="420" font-family="Courier New, monospace" font-size="14" fill="#abb2bf">}</text>
  <text x="775" y="420" font-family="Courier New, monospace" font-size="14" fill="#e06c75">&lt;/</text>
  <text x="805" y="420" font-family="Courier New, monospace" font-size="14" fill="#e06c75">h1</text>
  <text x="840" y="420" font-family="Courier New, monospace" font-size="14" fill="#e06c75">&gt;</text>
  
  <text x="520" y="445" font-family="Courier New, monospace" font-size="14" fill="#e06c75">&lt;/</text>
  <text x="550" y="445" font-family="Courier New, monospace" font-size="14" fill="#e06c75">div</text>
  <text x="590" y="445" font-family="Courier New, monospace" font-size="14" fill="#e06c75">&gt;</text>
  
  <text x="490" y="470" font-family="Courier New, monospace" font-size="14" fill="#abb2bf">)</text>
  
  <text x="460" y="495" font-family="Courier New, monospace" font-size="14" fill="#abb2bf">}</text>
  
  <text x="460" y="545" font-family="Courier New, monospace" font-size="14" fill="#c678dd">export</text>
  <text x="540" y="545" font-family="Courier New, monospace" font-size="14" fill="#c678dd">default</text>
  <text x="630" y="545" font-family="Courier New, monospace" font-size="14" fill="#e5e5e5">App</text>
  
