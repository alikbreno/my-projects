  <rect x="140" y="260" width="320" height="510" rx="12" fill="#1e1e3f"/>
  <text x="160" y="295" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#aaa">TO DO</text>
  <circle cx="430" cy="287" r="12" fill="#2a2a4f"/>
  <text x="430" y="293" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#aaa" text-anchor="middle">8</text>
  
  <!-- Task Card 1 -->
  <rect x="160" y="320" width="280" height="110" rx="10" fill="#2a2a4f"/>
  <rect x="160" y="320" width="280" height="6" rx="3" fill="#f107a3"/>
