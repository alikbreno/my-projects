<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="8" stdDeviation="15" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Main Container -->
  <rect x="100" y="80" width="1200" height="720" rx="20" fill="#181830" filter="url(#shadow2)"/>
  
  <!-- Header -->
  <rect x="100" y="80" width="1200" height="80" rx="20" fill="#7b2ff7" opacity="0.15"/>
  <text x="140" y="130" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Project Manager Pro</text>
  
  <!-- Tabs -->
  <rect x="140" y="185" width="120" height="40" rx="10" fill="#7b2ff7"/>
  <text x="200" y="212" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Board</text>
  
  <text x="320" y="212" font-family="Arial, sans-serif" font-size="15" fill="#888" text-anchor="middle">List</text>
  <text x="430" y="212" font-family="Arial, sans-serif" font-size="15" fill="#888" text-anchor="middle">Calendar</text>
  <text x="560" y="212" font-family="Arial, sans-serif" font-size="15" fill="#888" text-anchor="middle">Timeline</text>
  
  <!-- Filter Button -->
  <rect x="1050" y="192" width="100" height="35" rx="8" fill="#2a2a4f" stroke="#7b2ff7" stroke-width="1"/>
  <text x="1100" y="216" font-family="Arial, sans-serif" font-size="14" fill="#7b2ff7" text-anchor="middle">Filter</text>
  
  <!-- Add Button -->
  <rect x="1170" y="192" width="100" height="35" rx="8" fill="#7b2ff7"/>
  <text x="1220" y="216" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">+ Add</text>
  
