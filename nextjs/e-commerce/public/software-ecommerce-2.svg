  <circle cx="180" cy="535" r="12" fill="#00d4ff"/>
  <text x="200" y="540" font-family="Arial, sans-serif" font-size="11" fill="#aaa">Backend</text>
  <text x="405" y="540" font-family="Arial, sans-serif" font-size="11" fill="#888" text-anchor="end">Due: Dec 22</text>
  
  <!-- Column 2: In Progress -->
  <rect x="480" y="260" width="320" height="510" rx="12" fill="#1e1e3f"/>
  <text x="500" y="295" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#aaa">IN PROGRESS</text>
