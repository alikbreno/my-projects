  <rect x="1150" y="115" width="120" height="30" rx="15" fill="#2a2a4f"/>
  <text x="1210" y="137" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#00ff88" text-anchor="middle">65% Complete</text>
