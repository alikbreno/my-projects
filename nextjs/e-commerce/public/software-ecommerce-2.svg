  <text x="720" y="409" font-family="Arial, sans-serif" font-size="10" fill="#7b2ff7" text-anchor="middle">50% done</text>
  
  <!-- Task Card 4 -->
  <rect x="500" y="450" width="280" height="110" rx="10" fill="#2a2a4f"/>
  <rect x="500" y="450" width="280" height="6" rx="3" fill="#00ff88"/>
  <text x="515" y="480" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#fff">Database optimization</text>
  <text x="515" y="505" font-family="Arial, sans-serif" font-size="12" fill="#aaa">Query performance tuning</text>
  <circle cx="520" cy="535" r="12" fill="#00ff88"/>
  <text x="540" y="540" font-family="Arial, sans-serif" font-size="11" fill="#aaa">DevOps</text>
  <rect x="680" y="525" width="80" height="20" rx="10" fill="#7b2ff7" opacity="0.3"/>
  <text x="720" y="539" font-family="Arial, sans-serif" font-size="10" fill="#7b2ff7" text-anchor="middle">75% done</text>
  
  <!-- Column 3: Done -->
  <rect x="820" y="260" width="320" height="510" rx="12" fill="#1e1e3f"/>
  <text x="840" y="295" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#aaa">DONE</text>
  <circle cx="1110" cy="287" r="12" fill="#2a2a4f"/>
  <text x="1110" y="293" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#aaa" text-anchor="middle">12</text>
  
  <!-- Task Card 5 -->
  <rect x="840" y="320" width="280" height="110" rx="10" fill="#2a2a4f"/>
  <rect x="840" y="320" width="280" height="6" rx="3" fill="#00ff88"/>
  <text x="855" y="350" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#fff">Mobile responsive design</text>
  <text x="855" y="375" font-family="Arial, sans-serif" font-size="12" fill="#aaa">All breakpoints tested</text>
  <circle cx="860" cy="405" r="12" fill="#00ff88"/>
  <text x="880" y="410" font-family="Arial, sans-serif" font-size="11" fill="#aaa">Frontend</text>
  <circle cx="1090" cy="405" r="15" fill="#00ff88"/>
  <text x="1090" y="411" font-family="Arial, sans-serif" font-size="18" fill="#1e1e3f" text-anchor="middle">✓</text>
  
  <!-- Task Card 6 -->
  <rect x="840" y="450" width="280" height="110" rx="10" fill="#2a2a4f"/>
  <rect x="840" y="450" width="280" height="6" rx="3" fill="#00ff88"/>
  <text x="855" y="480" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#fff">Testing suite setup</text>
  <text x="855" y="505" font-family="Arial, sans-serif" font-size="12" fill="#aaa">Jest + React Testing Library</text>
  <circle cx="860" cy="535" r="12" fill="#00ff88"/>
  <text x="880" y="540" font-family="Arial, sans-serif" font-size="11" fill="#aaa">QA</text>
  <circle cx="1090" cy="535" r="15" fill="#00ff88"/>
  <text x="1090" y="541" font-family="Arial, sans-serif" font-size="18" fill="#1e1e3f" text-anchor="middle">✓</text>
  
