<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Main Dashboard Container -->
  <rect x="100" y="80" width="1200" height="720" rx="20" fill="#1e1e3f" filter="url(#shadow)"/>
  
  <!-- Top Bar -->
  <rect x="100" y="80" width="1200" height="70" rx="20" fill="#252547"/>
  <text x="140" y="125" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Analytics Dashboard</text>
  
  <!-- Search Bar -->
  <rect x="900" y="100" width="300" height="40" rx="20" fill="#1a1a35" stroke="#00d4ff" stroke-width="1"/>
  <text x="920" y="127" font-family="Arial, sans-serif" font-size="14" fill="#888">Search...</text>
  
  <!-- Profile Icon -->
  <circle cx="1250" cy="120" r="20" fill="#00d4ff"/>
  
  <!-- Sidebar -->
  <rect x="100" y="150" width="250" height="650" fill="#252547"/>
  
  <!-- Sidebar Items -->
  <rect x="120" y="180" width="210" height="45" rx="10" fill="#00d4ff" opacity="0.2"/>
  <text x="140" y="210" font-family="Arial, sans-serif" font-size="16" fill="#00d4ff" font-weight="bold">📊 Dashboard</text>
  
  <text x="140" y="265" font-family="Arial, sans-serif" font-size="16" fill="#aaa">📈 Analytics</text>
  <text x="140" y="315" font-family="Arial, sans-serif" font-size="16" fill="#aaa">👥 Users</text>
  <text x="140" y="365" font-family="Arial, sans-serif" font-size="16" fill="#aaa">⚙️ Settings</text>
  <text x="140" y="415" font-family="Arial, sans-serif" font-size="16" fill="#aaa">📁 Files</text>
  
  <!-- Main Content Area -->
  <!-- Stats Cards -->
  <rect x="380" y="180" width="280" height="140" rx="15" fill="#2a2a4f"/>
  <text x="400" y="215" font-family="Arial, sans-serif" font-size="14" fill="#aaa">Total Revenue</text>
  <text x="400" y="260" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#00d4ff">$45,678</text>
  <text x="400" y="295" font-family="Arial, sans-serif" font-size="14" fill="#00ff88">↑ 12.5% from last month</text>
  
  <rect x="690" y="180" width="280" height="140" rx="15" fill="#2a2a4f"/>
  <text x="710" y="215" font-family="Arial, sans-serif" font-size="14" fill="#aaa">Active Users</text>
  <text x="710" y="260" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#f107a3">12,456</text>
  <text x="710" y="295" font-family="Arial, sans-serif" font-size="14" fill="#00ff88">↑ 8.2% from last month</text>
  
  <rect x="1000" y="180" width="280" height="140" rx="15" fill="#2a2a4f"/>
  <text x="1020" y="215" font-family="Arial, sans-serif" font-size="14" fill="#aaa">Conversion Rate</text>
  <text x="1020" y="260" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#ffd700">3.24%</text>
  <text x="1020" y="295" font-family="Arial, sans-serif" font-size="14" fill="#ff5555">↓ 2.1% from last month</text>
  
  <!-- Chart Area -->
  <rect x="380" y="350" width="590" height="420" rx="15" fill="#2a2a4f"/>
  <text x="400" y="385" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff">Revenue Overview</text>
  
  <!-- Bar Chart -->
  <rect x="420" y="650" width="40" height="100" rx="5" fill="#00d4ff" opacity="0.8"/>
  <rect x="480" y="600" width="40" height="150" rx="5" fill="#00d4ff" opacity="0.8"/>
  <rect x="540" y="580" width="40" height="170" rx="5" fill="#00d4ff" opacity="0.8"/>
  <rect x="600" y="620" width="40" height="130" rx="5" fill="#00d4ff" opacity="0.8"/>
  <rect x="660" y="560" width="40" height="190" rx="5" fill="#00d4ff" opacity="0.8"/>
  <rect x="720" y="600" width="40" height="150" rx="5" fill="#00d4ff" opacity="0.8"/>
  <rect x="780" y="540" width="40" height="210" rx="5" fill="#00d4ff" opacity="0.8"/>
  <rect x="840" y="590" width="40" height="160" rx="5" fill="#00d4ff" opacity="0.8"/>
  <rect x="900" y="570" width="40" height="180" rx="5" fill="#00d4ff" opacity="0.8"/>
  
  <!-- Months labels -->
  <text x="430" y="770" font-family="Arial, sans-serif" font-size="11" fill="#888">Jan</text>
  <text x="490" y="770" font-family="Arial, sans-serif" font-size="11" fill="#888">Feb</text>
  <text x="550" y="770" font-family="Arial, sans-serif" font-size="11" fill="#888">Mar</text>
  <text x="610" y="770" font-family="Arial, sans-serif" font-size="11" fill="#888">Apr</text>
  <text x="670" y="770" font-family="Arial, sans-serif" font-size="11" fill="#888">May</text>
  <text x="730" y="770" font-family="Arial, sans-serif" font-size="11" fill="#888">Jun</text>
  <text x="790" y="770" font-family="Arial, sans-serif" font-size="11" fill="#888">Jul</text>
  <text x="850" y="770" font-family="Arial, sans-serif" font-size="11" fill="#888">Aug</text>
  <text x="910" y="770" font-family="Arial, sans-serif" font-size="11" fill="#888">Sep</text>
  
  <!-- Recent Activity -->
  <rect x="1000" y="350" width="280" height="420" rx="15" fill="#2a2a4f"/>
  <text x="1020" y="385" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff">Recent Activity</text>
  
  <!-- Activity Items -->
  <circle cx="1030" cy="430" r="8" fill="#00d4ff"/>
  <text x="1055" y="435" font-family="Arial, sans-serif" font-size="13" fill="#ddd">New user registered</text>
  <text x="1055" y="452" font-family="Arial, sans-serif" font-size="11" fill="#888">2 minutes ago</text>
  
  <circle cx="1030" cy="490" r="8" fill="#f107a3"/>
  <text x="1055" y="495" font-family="Arial, sans-serif" font-size="13" fill="#ddd">Payment received</text>
  <text x="1055" y="512" font-family="Arial, sans-serif" font-size="11" fill="#888">15 minutes ago</text>
  
  <circle cx="1030" cy="550" r="8" fill="#ffd700"/>
  <text x="1055" y="555" font-family="Arial, sans-serif" font-size="13" fill="#ddd">Report generated</text>
  <text x="1055" y="572" font-family="Arial, sans-serif" font-size="11" fill="#888">1 hour ago</text>
  
  <circle cx="1030" cy="610" r="8" fill="#00ff88"/>
  <text x="1055" y="615" font-family="Arial, sans-serif" font-size="13" fill="#ddd">System update</text>
  <text x="1055" y="632" font-family="Arial, sans-serif" font-size="11" fill="#888">3 hours ago</text>
  
  <circle cx="1030" cy="670" r="8" fill="#ff5555"/>
  <text x="1055" y="675" font-family="Arial, sans-serif" font-size="13" fill="#ddd">Error logged</text>
  <text x="1055" y="692" font-family="Arial, sans-serif" font-size="11" fill="#888">5 hours ago</text>
</svg>