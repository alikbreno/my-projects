<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow6">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Main Container -->
  <rect x="85" y="45" width="1230" height="810" rx="20" fill="#12151f" filter="url(#shadow6)"/>
  
  <!-- Header -->
  <rect x="85" y="45" width="1230" height="80" rx="20" fill="#1a1f2e"/>
  <text x="125" y="93" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#fff">FinanceHub</text>
  <text x="290" y="95" font-family="Arial, sans-serif" font-size="16" fill="#6b7280">Dashboard</text>
  
  <!-- Navigation -->
  <text x="560" y="90" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#3b82f6">Overview</text>
  <text x="665" y="90" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Transactions</text>
  <text x="795" y="90" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Budgets</text>
  <text x="900" y="90" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Reports</text>
  <text x="995" y="90" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Settings</text>
  
  <!-- Notification Icon -->
  <circle cx="1210" cy="85" r="18" fill="#232a3f"/>
  <text x="1210" y="92" font-family="Arial, sans-serif" font-size="16" fill="#fff" text-anchor="middle">🔔</text>
  <circle cx="1223" cy="77" r="6" fill="#ef4444"/>
  
  <!-- Profile -->
  <circle cx="1260" cy="85" r="20" fill="#10b981"/>
  <text x="1260" y="92" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">JD</text>
  
  <!-- Main Content Area -->
  
  <!-- Welcome Section -->
  <text x="125" y="170" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#fff">Welcome back, John!</text>
  <text x="125" y="200" font-family="Arial, sans-serif" font-size="15" fill="#9ca3af">Here's your financial overview for January 2026</text>
  
  <!-- Stats Cards Row -->
  
  <!-- Card 1 - Total Balance -->
  <rect x="125" y="230" width="360" height="140" rx="15" fill="#1a1f2e" filter="url(#shadow6)"/>
  <text x="155" y="265" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Total Balance</text>
  <text x="155" y="310" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#10b981">$48,294.50</text>
  <text x="155" y="345" font-family="Arial, sans-serif" font-size="13" fill="#10b981">↑ $2,485 (5.4%) this month</text>
  
  <!-- Card 2 - Monthly Income -->
  <rect x="505" y="230" width="360" height="140" rx="15" fill="#1a1f2e" filter="url(#shadow6)"/>
  <text x="535" y="265" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Monthly Income</text>
  <text x="535" y="310" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#3b82f6">$8,450.00</text>
  <text x="535" y="345" font-family="Arial, sans-serif" font-size="13" fill="#3b82f6">↑ $450 (5.6%) vs last month</text>
  
  <!-- Card 3 - Monthly Expenses -->
  <rect x="885" y="230" width="360" height="140" rx="15" fill="#1a1f2e" filter="url(#shadow6)"/>
  <text x="915" y="265" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Monthly Expenses</text>
  <text x="915" y="310" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#ef4444">$5,876.30</text>
  <text x="915" y="345" font-family="Arial, sans-serif" font-size="13" fill="#ef4444">↓ $125 (2.1%) vs last month</text>
  
  <!-- Spending Chart Section -->
  <rect x="125" y="400" width="750" height="420" rx="15" fill="#1a1f2e" filter="url(#shadow6)"/>
  <text x="155" y="440" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff">Spending Overview</text>
  
  <!-- Tabs -->
  <rect x="155" y="460" width="80" height="35" rx="8" fill="#3b82f6"/>
  <text x="195" y="484" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Week</text>
  
  <rect x="245" y="460" width="80" height="35" rx="8" fill="#232a3f"/>
  <text x="285" y="484" font-family="Arial, sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">Month</text>
  
  <rect x="335" y="460" width="80" height="35" rx="8" fill="#232a3f"/>
  <text x="375" y="484" font-family="Arial, sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">Year</text>
  
  <!-- Bar Chart -->
  <line x1="180" y1="750" x2="840" y2="750" stroke="#2d3548" stroke-width="1"/>
  
  <rect x="200" y="670" width="50" height="80" rx="6" fill="#3b82f6" opacity="0.8"/>
  <text x="225" y="770" font-family="Arial, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">Mon</text>
  
  <rect x="280" y="640" width="50" height="110" rx="6" fill="#3b82f6" opacity="0.8"/>
  <text x="305" y="770" font-family="Arial, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">Tue</text>
  
  <rect x="360" y="600" width="50" height="150" rx="6" fill="#3b82f6" opacity="0.8"/>
  <text x="385" y="770" font-family="Arial, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">Wed</text>
  
  <rect x="440" y="650" width="50" height="100" rx="6" fill="#3b82f6" opacity="0.8"/>
  <text x="465" y="770" font-family="Arial, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">Thu</text>
  
  <rect x="520" y="620" width="50" height="130" rx="6" fill="#3b82f6" opacity="0.8"/>
  <text x="545" y="770" font-family="Arial, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">Fri</text>
  
  <rect x="600" y="680" width="50" height="70" rx="6" fill="#3b82f6" opacity="0.8"/>
  <text x="625" y="770" font-family="Arial, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">Sat</text>
  
  <rect x="680" y="710" width="50" height="40" rx="6" fill="#3b82f6" opacity="0.8"/>
  <text x="705" y="770" font-family="Arial, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">Sun</text>
  
  <!-- Y-axis labels -->
  <text x="165" y="755" font-family="Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">$0</text>
  <text x="165" y="680" font-family="Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">$500</text>
  <text x="165" y="605" font-family="Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">$1000</text>
  
  <!-- Recent Transactions -->
  <rect x="895" y="400" width="350" height="420" rx="15" fill="#1a1f2e" filter="url(#shadow6)"/>
  <text x="925" y="440" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff">Recent Transactions</text>
  
  <!-- Transaction 1 -->
  <rect x="920" y="470" width="300" height="60" rx="10" fill="#232a3f"/>
  <circle cx="945" cy="500" r="18" fill="#ef4444" opacity="0.2"/>
  <text x="945" y="507" font-family="Arial, sans-serif" font-size="18" fill="#ef4444" text-anchor="middle">🛒</text>
  <text x="980" y="495" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Grocery Store</text>
  <text x="980" y="515" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Today, 2:34 PM</text>
  <text x="1190" y="503" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ef4444" text-anchor="end">-$124.50</text>
  
  <!-- Transaction 2 -->
  <rect x="920" y="545" width="300" height="60" rx="10" fill="#232a3f"/>
  <circle cx="945" cy="575" r="18" fill="#10b981" opacity="0.2"/>
  <text x="945" y="582" font-family="Arial, sans-serif" font-size="18" fill="#10b981" text-anchor="middle">💰</text>
  <text x="980" y="570" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Salary Payment</text>
  <text x="980" y="590" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Yesterday</text>
  <text x="1190" y="578" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#10b981" text-anchor="end">+$4,500.00</text>
  
  <!-- Transaction 3 -->
  <rect x="920" y="620" width="300" height="60" rx="10" fill="#232a3f"/>
  <circle cx="945" cy="650" r="18" fill="#ef4444" opacity="0.2"/>
  <text x="945" y="657" font-family="Arial, sans-serif" font-size="18" fill="#ef4444" text-anchor="middle">⚡</text>
  <text x="980" y="645" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Electric Bill</text>
  <text x="980" y="665" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Jan 20</text>
  <text x="1190" y="653" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ef4444" text-anchor="end">-$89.30</text>
  
  <!-- Transaction 4 -->
  <rect x="920" y="695" width="300" height="60" rx="10" fill="#232a3f"/>
  <circle cx="945" cy="725" r="18" fill="#ef4444" opacity="0.2"/>
  <text x="945" y="732" font-family="Arial, sans-serif" font-size="18" fill="#ef4444" text-anchor="middle">🍕</text>
  <text x="980" y="720" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Restaurant</text>
  <text x="980" y="740" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Jan 19</text>
  <text x="1190" y="728" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ef4444" text-anchor="end">-$56.80</text>
  
  <!-- View All Button -->
  <rect x="920" y="770" width="300" height="35" rx="8" fill="#232a3f" stroke="#3b82f6" stroke-width="1"/>
  <text x="1070" y="794" font-family="Arial, sans-serif" font-size="13" fill="#3b82f6" text-anchor="middle">View All Transactions</text>
</svg>