<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow5">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Main Container -->
  <rect x="90" y="50" width="1220" height="780" rx="18" fill="#141824" filter="url(#shadow5)"/>
  
  <!-- Header -->
  <rect x="90" y="50" width="1220" height="75" rx="18" fill="#1e2437"/>
  <text x="130" y="95" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#fff">📧 Email Client</text>
  
  <!-- Search Bar -->
  <rect x="720" y="75" width="380" height="40" rx="20" fill="#141824" stroke="#3b82f6" stroke-width="1"/>
  <text x="750" y="101" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">Search emails...</text>
  
  <!-- Compose Button -->
  <rect x="1130" y="75" width="150" height="40" rx="20" fill="#3b82f6"/>
  <text x="1205" y="101" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">+ Compose</text>
  
  <!-- Sidebar -->
  <rect x="90" y="125" width="260" height="705" fill="#1a1f32"/>
  
  <!-- Mailbox Items -->
  <rect x="105" y="150" width="230" height="50" rx="10" fill="#3b82f6" opacity="0.15"/>
  <text x="130" y="180" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#3b82f6">📥 Inbox</text>
  <circle cx="305" cy="175" r="12" fill="#ef4444"/>
  <text x="305" y="180" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">24</text>
  
  <text x="130" y="240" font-family="Arial, sans-serif" font-size="15" fill="#9ca3af">⭐ Starred</text>
  <text x="130" y="290" font-family="Arial, sans-serif" font-size="15" fill="#9ca3af">📤 Sent</text>
  <text x="130" y="340" font-family="Arial, sans-serif" font-size="15" fill="#9ca3af">📝 Drafts</text>
  <circle cx="305" cy="335" r="10" fill="#6b7280"/>
  <text x="305" y="340" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
  
  <text x="130" y="390" font-family="Arial, sans-serif" font-size="15" fill="#9ca3af">🗑️ Trash</text>
  
  <line x1="105" y1="420" x2="335" y2="420" stroke="#2d3548" stroke-width="1"/>
  
  <text x="115" y="455" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#6b7280">LABELS</text>
  
  <!-- Labels -->
  <circle cx="120" cy="485" r="6" fill="#10b981"/>
  <text x="135" y="490" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Work</text>
  
  <circle cx="120" cy="520" r="6" fill="#f59e0b"/>
  <text x="135" y="525" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Personal</text>
  
  <circle cx="120" cy="555" r="6" fill="#8b5cf6"/>
  <text x="135" y="560" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Clients</text>
  
  <!-- Email List -->
  <rect x="350" y="125" width="420" height="705" fill="#1a1f32"/>
  
  <!-- List Header -->
  <rect x="350" y="125" width="420" height="55" fill="#1e2437"/>
  <text x="370" y="160" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff">Inbox</text>
  <text x="450" y="162" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">24 unread</text>
  
  <!-- Email Item 1 - Selected -->
  <rect x="360" y="195" width="400" height="90" rx="10" fill="#232a3f"/>
  <circle cx="380" cy="225" r="20" fill="#3b82f6"/>
  <text x="380" y="232" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">JD</text>
  
  <text x="415" y="220" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#fff">John Doe</text>
  <circle cx="510" cy="217" r="4" fill="#3b82f6"/>
  <text x="720" y="220" font-family="Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">10:30 AM</text>
  
  <text x="415" y="242" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#e5e7eb">Project Update - Q4 Results</text>
  <text x="415" y="265" font-family="Arial, sans-serif" font-size="13" fill="#9ca3af">Hey team, I've compiled the Q4 results. Please review...</text>
  
  <!-- Email Item 2 -->
  <rect x="360" y="295" width="400" height="90" rx="10" fill="#1a1f32"/>
  <circle cx="380" cy="325" r="20" fill="#10b981"/>
  <text x="380" y="332" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">SM</text>
  
  <text x="415" y="320" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#fff">Sarah Miller</text>
  <circle cx="530" cy="317" r="4" fill="#3b82f6"/>
  <text x="720" y="320" font-family="Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">Yesterday</text>
  
  <text x="415" y="342" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#e5e7eb">Meeting Rescheduled</text>
  <text x="415" y="365" font-family="Arial, sans-serif" font-size="13" fill="#9ca3af">The client meeting has been moved to next Tuesday...</text>
  
  <!-- Email Item 3 -->
  <rect x="360" y="395" width="400" height="90" rx="10" fill="#1a1f32"/>
  <circle cx="380" cy="425" r="20" fill="#f59e0b"/>
  <text x="380" y="432" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">AL</text>
  
  <text x="415" y="420" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#fff">Alex Lee</text>
  <text x="720" y="420" font-family="Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">Monday</text>
  
  <text x="415" y="442" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Design Review Feedback</text>
  <text x="415" y="465" font-family="Arial, sans-serif" font-size="13" fill="#71717a">Great work on the new dashboard! Just a few notes...</text>
  
  <!-- Email Item 4 -->
  <rect x="360" y="495" width="400" height="90" rx="10" fill="#1a1f32"/>
  <circle cx="380" cy="525" r="20" fill="#ec4899"/>
  <text x="380" y="532" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">MC</text>
  
  <text x="415" y="520" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#fff">Marketing Cloud</text>
  <text x="720" y="520" font-family="Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">Dec 18</text>
  
  <text x="415" y="542" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Your campaign performance report</text>
  <text x="415" y="565" font-family="Arial, sans-serif" font-size="13" fill="#71717a">Monthly insights: 2,450 clicks, 12% conversion rate...</text>
  
  <!-- Email Detail Panel -->
  <rect x="770" y="125" width="540" height="705" fill="#141824"/>
  
  <!-- Email Header -->
  <rect x="770" y="125" width="540" height="130" fill="#1a1f32"/>
  
  <text x="800" y="165" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff">Project Update - Q4 Results</text>
  
  <circle cx="800" cy="200" r="18" fill="#3b82f6"/>
  <text x="800" y="207" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">JD</text>
  
  <text x="830" y="198" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#fff">John Doe</text>
  <text x="830" y="218" font-family="Arial, sans-serif" font-size="13" fill="#9ca3af">john.doe@company.com</text>
  
  <text x="1220" y="205" font-family="Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">Today at 10:30 AM</text>
  
  <!-- Action Buttons -->
  <rect x="800" y="775" width="80" height="35" rx="8" fill="#232a3f" stroke="#3b82f6" stroke-width="1"/>
  <text x="840" y="799" font-family="Arial, sans-serif" font-size="13" fill="#3b82f6" text-anchor="middle">Reply</text>
  
  <rect x="895" y="775" width="90" height="35" rx="8" fill="#232a3f" stroke="#6b7280" stroke-width="1"/>
  <text x="940" y="799" font-family="Arial, sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">Forward</text>
  
  <!-- Email Body -->
  <text x="800" y="295" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Hi Team,</text>
  
  <text x="800" y="330" font-family="Arial, sans-serif" font-size="14" fill="#d1d5db">I hope this email finds you well. I've compiled our Q4 results</text>
  <text x="800" y="355" font-family="Arial, sans-serif" font-size="14" fill="#d1d5db">and wanted to share some exciting news!</text>
  
  <text x="800" y="395" font-family="Arial, sans-serif" font-size="14" fill="#d1d5db">Key Highlights:</text>
  <text x="820" y="425" font-family="Arial, sans-serif" font-size="14" fill="#d1d5db">• Revenue increased by 28% compared to Q3</text>
  <text x="820" y="450" font-family="Arial, sans-serif" font-size="14" fill="#d1d5db">• Customer satisfaction rating reached 94%</text>
  <text x="820" y="475" font-family="Arial, sans-serif" font-size="14" fill="#d1d5db">• Successfully launched 3 new product features</text>
  
  <text x="800" y="515" font-family="Arial, sans-serif" font-size="14" fill="#d1d5db">Please review the attached report and let me know if you have</text>
  <text x="800" y="540" font-family="Arial, sans-serif" font-size="14" fill="#d1d5db">any questions. We'll discuss this in detail during our team</text>
  <text x="800" y="565" font-family="Arial, sans-serif" font-size="14" fill="#d1d5db">meeting next week.</text>
  
  <text x="800" y="605" font-family="Arial, sans-serif" font-size="14" fill="#d1d5db">Best regards,</text>
  <text x="800" y="630" font-family="Arial, sans-serif" font-size="14" fill="#d1d5db">John</text>
  
  <!-- Attachment -->
  <rect x="800" y="670" width="280" height="70" rx="10" fill="#1a1f32" stroke="#3b82f6" stroke-width="1"/>
  <rect x="815" y="685" width="40" height="40" rx="6" fill="#3b82f6" opacity="0.2"/>
  <text x="835" y="713" font-family="Arial, sans-serif" font-size="20" fill="#3b82f6" text-anchor="middle">📄</text>
  <text x="870" y="700" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Q4_Report_2024.pdf</text>
  <text x="870" y="720" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">2.4 MB</text>
  <text x="1050" y="710" font-family="Arial, sans-serif" font-size="12" fill="#3b82f6">Download</text>
</svg>